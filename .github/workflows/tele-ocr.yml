name: Tele OCR

on:
  workflow_dispatch:
    inputs:
      file_path:
        description: Telegram file_path (cth: photos/file_4.jpg)
        required: true
        default: photos/file_4.jpg
  push:
    branches: [gh-pages]
    paths:
      - ".github/workflows/tele-ocr.yml"

permissions:
  contents: read

jobs:
  ocr:
    runs-on: ubuntu-latest
    steps:
      - name: Sediakan alat
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq tesseract-ocr curl
      - name: Download + OCR + hantar
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
          FILE_PATH: ${{ github.event.inputs.file_path || 'photos/file_4.jpg' }}
        run: |
          set -e
          URL="https://api.telegram.org/file/${TG_TOKEN}/${FILE_PATH}"
          echo "Downloading $URL"
          curl -s --fail --max-time 60 "$URL" -o /tmp/img
          ls -la /tmp/img
          TEXT="$(tesseract /tmp/img - --psm 3 2>/dev/null || true)"
          if [ -z "$TEXT" ]; then TEXT="(tiada teks ditemui)"; fi
          MSG="📸 OCR (Actions runner): ${FILE_PATH}"
          MSG="$(printf '%s\n\n📝 %s' "$MSG" "$TEXT")"
          echo "== TEX =="
          echo "$MSG"
          curl -s --max-time 30 -X POST "https://api.telegram.org/${TG_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TG_CHAT}" \
            --data-urlencode "text=${MSG}"