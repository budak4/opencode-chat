name: T
on:
  workflow_dispatch:
    inputs:
      file_path:
        description: path
        required: true
        default: photos/x.jpg
  push:
    branches: [test-trigger]
jobs:
  ocr:
    runs-on: ubuntu-latest
    steps:
      - name: dl
        env:
          FILE_PATH: ${{ github.event.inputs.file_path || 'PHOTO' }}
        run: |
          TEXT="$(tesseract /tmp/img - --psm 3 2>/dev/null || true)"
          echo "ok ${TEXT}"
