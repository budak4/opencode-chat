name: T
on:
  workflow_dispatch:
    inputs:
      file_path:
        description: path
        required: true
        default: photos/x.jpg
  push:
    branches: [test-trigger]
jobs:
  ocr:
    runs-on: ubuntu-latest
    steps:
      - name: Sediakan alat
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq tesseract-ocr curl
      - name: dl
        env:
          FILE_PATH: ${{ github.event.inputs.file_path || 'PHOTO' }}
        run: |
          curl -s --max-time 10 "$URL" -o /tmp/img
          echo ok
