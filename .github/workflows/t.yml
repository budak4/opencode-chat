name: T
on: push
jobs:
  x:
    runs-on: ubuntu-latest
    env:
      FILE_PATH: ${{ github.event.inputs.file_path || 'photos/file_4.jpg' }}
    steps:
      - name: Sediakan alat
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq tesseract-ocr curl
      - name: Download + OCR + hantar
        run: |
          set -e
          URL="https://api.telegram.org/file/${TG_TOKEN}/${FILE_PATH}"
          echo "Downloading $URL"
          TEXT="X"
          MSG="📸 OCR (Actions runner): ${FILE_PATH}"
          MSG="$(printf '%s\n\n📝 %s' "$MSG" "$TEXT")"
          echo "$MSG"
