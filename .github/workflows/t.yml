name: TeleOCR
on:
  workflow_dispatch:
    inputs:
      file_path:
        description: Telegram file path
        required: true
        default: photos/file_4.jpg
jobs:
  ocr:
    runs-on: ubuntu-latest
    steps:
      - name: OCR + hantar
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
          FILE_PATH: ${{ github.event.inputs.file_path || 'photos/file_4.jpg' }}
        run: |
          echo "token len: ${#TG_TOKEN}"
          echo "chat len: ${#TG_CHAT}"
          echo "path: ${FILE_PATH}"
          command -v tesseract >/dev/null 2>&1 || (sudo apt-get update -qq && sudo apt-get install -y tesseract-ocr)
          set -e
          URL="https://api.telegram.org/file/${TG_TOKEN}/${FILE_PATH}"
          echo "Downloading $URL"
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0 Safari/537.36"
          curl -sf -A "$UA" --max-time 60 "$URL" -o /tmp/img || { echo "browser-UA failed, retry plain"; curl -sS --max-time 60 "$URL" -o /tmp/img; }
          file /tmp/img; ls -la /tmp/img
          if command -v convert >/dev/null 2>&1; then convert /tmp/img -resize 250% -colorspace Gray /tmp/big.png 2>/dev/null && mv /tmp/big.png /tmp/img; fi
          TEXT6="$(tesseract /tmp/img - --psm 6 2>/dev/null)"
          TEXT3="$(tesseract /tmp/img - --psm 3 2>/dev/null)"
          if [ -n "$TEXT6" ]; then TEXT="$TEXT6"; elif [ -n "$TEXT3" ]; then TEXT="$TEXT3"; else TEXT="(tiada teks)"; fi
          echo "OCR: $TEXT"
          MSG="📸 OCR: ${FILE_PATH}"
          MSG="$(printf '%s\n\n📝 %s' "$MSG" "$TEXT")"
          curl -s --max-time 30 -X POST "https://api.telegram.org/${TG_TOKEN}/sendMessage" --data-urlencode "chat_id=${TG_CHAT}" --data-urlencode "text=${MSG}"
      - name: Upload hasil
        uses: actions/upload-artifact@v4
        with:
          name: ocr-img
          path: /tmp/img
