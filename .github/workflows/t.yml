name: TeleOCR
on:
  workflow_dispatch:
    inputs:
      file_path:
        description: Telegram file path
        required: true
        default: photos/file_4.jpg
jobs:
  ocr:
    runs-on: ubuntu-latest
    steps:
      - name: OCR + hantar
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
          FILE_PATH: ${{ github.event.inputs.file_path || 'photos/file_4.jpg' }}
        run: |
          echo "token len: ${#TG_TOKEN}"
          echo "chat len: ${#TG_CHAT}"
          echo "path: ${FILE_PATH}"
          command -v tesseract >/dev/null 2>&1 || (sudo apt-get update -qq && sudo apt-get install -y tesseract-ocr)
          set -e
          URL="https://api.telegram.org/file/${TG_TOKEN}/${FILE_PATH}"
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0 Safari/537.36"
          ok=0
          for i in 1 2 3 4 5 6; do
            echo "cuba #$i"
            if curl -sf -A "$UA" --connect-timeout 20 -m 60 "$URL" -o /tmp/img; then ok=1; echo "OK direct"; break; fi
            ENC=$(python3 -c "import urllib.parse,sys; print(urllib.parse.quote(sys.argv[1],safe=''))" "$URL")
            if curl -sf --connect-timeout 20 -m 90 "https://api.allorigins.win/raw?url=$ENC" -o /tmp/img; then ok=1; echo "OK allorigins"; break; fi
            sleep 12
          done
          [ "$ok" = "1" ] || { echo "GAGAL download semua cubaan"; exit 1; }
          file /tmp/img; ls -la /tmp/img
          command -v convert >/dev/null 2>&1 && {
            convert /tmp/img -colorspace Gray -resize 300% /tmp/gray.png 2>/dev/null
            convert /tmp/img -colorspace Gray -resize 300% -negate -threshold 50% /tmp/bin.png 2>/dev/null
            convert /tmp/img -colorspace Gray -resize 300% -negate /tmp/inv.png 2>/dev/null
          }
          best=""
          for f in /tmp/img /tmp/gray.png /tmp/bin.png /tmp/inv.png; do
            [ -f "$f" ] || continue
            for psm in 3 6 11 13; do
              out="$(tesseract "$f" - --psm $psm 2>/dev/null | tr -s '[:space:]')"
              if [ -n "$out" ] && [ ${#out} -gt ${#best} ]; then best="$out"; fi
            done
          done
          TEXT="${best:-(tiada teks)}"
          echo "OCR: $TEXT"
          MSG="📸 OCR: ${FILE_PATH}"
          MSG="$(printf '%s\n\n📝 %s' "$MSG" "$TEXT")"
          curl -s --max-time 30 -X POST "https://api.telegram.org/${TG_TOKEN}/sendMessage" --data-urlencode "chat_id=${TG_CHAT}" --data-urlencode "text=${MSG}"
      - name: Upload hasil
        uses: actions/upload-artifact@v4
        with:
          name: ocr-img
          path: /tmp/img
